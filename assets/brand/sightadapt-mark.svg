<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">SightAdapt product mark</title>
  <desc id="description">A stylized eye on a rounded dark-blue square with a blue and violet iris.</desc>
  <metadata>Copyright 2026 KeyffMS / aiteracja.pl. SightAdapt is distributed under the repository license.</metadata>
  <defs>
    <linearGradient id="background" x1="28" y1="24" x2="226" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13203B"/>
      <stop offset="1" stop-color="#202A55"/>
    </linearGradient>
    <linearGradient id="iris" x1="88" y1="78" x2="170" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#42E8FF"/>
      <stop offset="0.52" stop-color="#55B8FF"/>
      <stop offset="1" stop-color="#B38CFF"/>
    </linearGradient>
    <linearGradient id="irisShade" x1="104" y1="96" x2="154" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16304D" stop-opacity="0"/>
      <stop offset="1" stop-color="#16304D" stop-opacity="0.48"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#050817" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#background)"/>
  <rect x="19" y="19" width="218" height="218" rx="51" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6"/>

  <path
    d="M42 128 C66 84 96 64 128 64 C160 64 190 84 214 128 C190 172 160 192 128 192 C96 192 66 172 42 128 Z"
    fill="#F7FAFF"
    filter="url(#shadow)"/>

  <circle cx="128" cy="128" r="47" fill="url(#iris)"/>
  <path d="M86 143 A47 47 0 0 0 170 143 A47 47 0 0 1 86 143 Z" fill="url(#irisShade)"/>
  <circle cx="128" cy="128" r="22" fill="#10182F"/>
  <circle cx="115" cy="112" r="9" fill="#FFFFFF" fill-opacity="0.92"/>
  <path d="M182 80 L190 72 L204 86 L196 94 Z" fill="#7FF1FF"/>
</svg>
