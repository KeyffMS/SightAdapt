<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc"><title id="title">SightAdapt architecture</title><desc id="desc">Foreground Windows application metadata flows to SightAdapt assignment and profile logic, which controls an input-transparent overlay through the Windows Magnification API.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#111827}.box{fill:#fff;stroke:#64748b;stroke-width:2}.accent{fill:#eef4ff;stroke:#2563eb;stroke-width:2}.arrow{stroke:#334155;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#334155"/></marker></defs><rect class="box" x="30" y="120" width="190" height="110" rx="14"/><text x="125" y="160" text-anchor="middle" font-size="22" font-weight="700">Foreground app</text><text x="125" y="190" text-anchor="middle" font-size="16">window + process metadata</text><rect class="accent" x="300" y="70" width="300" height="210" rx="14"/><text x="450" y="115" text-anchor="middle" font-size="25" font-weight="700">SightAdapt</text><text x="450" y="155" text-anchor="middle" font-size="17">assignment resolution</text><text x="450" y="185" text-anchor="middle" font-size="17">visual profile selection</text><text x="450" y="215" text-anchor="middle" font-size="17">overlay scope + menu handling</text><text x="450" y="245" text-anchor="middle" font-size="17">emergency disable</text><rect class="box" x="680" y="120" width="210" height="110" rx="14"/><text x="785" y="158" text-anchor="middle" font-size="21" font-weight="700">Windows overlay</text><text x="785" y="188" text-anchor="middle" font-size="16">Magnification API</text><text x="785" y="212" text-anchor="middle" font-size="16">input-transparent</text><line class="arrow" x1="220" y1="175" x2="292" y2="175"/><line class="arrow" x1="600" y1="175" x2="672" y2="175"/></svg>
