name: Temporary runtime contracts validation v3

on:
  pull_request:
    branches: ["0.5.0.50-alpha"]

concurrency:
  group: runtime-contracts-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/0.5.0.50-runtime-contracts-v3'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect publication state
        id: state
        shell: pwsh
        run: |
          $needsApply = -not (Test-Path .\src\SightAdapt\RuntimeOverlay.cs)
          "needs_apply=$($needsApply.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply reviewed runtime patch
        if: steps.state.outputs.needs_apply == 'true'
        shell: pwsh
        run: |
          $patch = Join-Path $env:RUNNER_TEMP 'runtime-contracts.patch'
          $env:RUNTIME_PATCH = $patch
          @'
          import base64
          import gzip
          import os
          from pathlib import Path

          root = Path('tools/0.5.0.50/runtime-contracts')
          payload = ''.join(
              path.read_text(encoding='utf-8')
              for path in sorted(root.glob('payload.*'))
          )
          Path(os.environ['RUNTIME_PATCH']).write_bytes(
              gzip.decompress(base64.b64decode(payload)))
          '@ | python -
          git apply --whitespace=error-all $patch
          Remove-Item tools/0.5.0.50/runtime-contracts -Recurse
          git diff --check

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\src\SightAdapt\SightAdapt.csproj
          dotnet restore .\tests\SightAdapt.Tests\SightAdapt.Tests.csproj

      - name: Build
        shell: pwsh
        run: dotnet build .\src\SightAdapt\SightAdapt.csproj --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: >-
          dotnet test .\tests\SightAdapt.Tests\SightAdapt.Tests.csproj
          --configuration Release
          --no-restore
          --results-directory "$env:RUNNER_TEMP\runtime-results"
          --logger "trx;LogFileName=runtime-contracts.trx"

      - name: Publish validated source branch
        if: steps.state.outputs.needs_apply == 'true'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          $changed = git diff --cached --name-only
          $changed | ForEach-Object { Write-Host $_ }
          if (-not ($changed | Select-String 'RuntimeOverlay.cs')) {
            throw 'The validated runtime source is not staged.'
          }
          git commit -m 'Use explicit runtime contracts and coherent settings snapshots'
          git push origin "HEAD:refs/heads/$env:GITHUB_HEAD_REF"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-contracts-v3-${{ github.run_id }}
          path: ${{ runner.temp }}\runtime-results\runtime-contracts.trx
          if-no-files-found: ignore
          retention-days: 3
