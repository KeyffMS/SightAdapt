name: Temporary runtime contracts validation v3

on:
  pull_request:
    branches: ["0.5.0.50-alpha"]

concurrency:
  group: runtime-contracts-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/0.5.0.50-runtime-contracts-v3'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BASE_BRANCH: 0.5.0.50-alpha
      GH_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply reviewed runtime patch
        shell: pwsh
        run: |
          git fetch origin $env:BASE_BRANCH
          $patch = Join-Path $env:RUNNER_TEMP 'runtime-contracts.patch'
          $env:RUNTIME_PATCH = $patch
          @'
          import base64
          import gzip
          import os
          from pathlib import Path

          root = Path('tools/0.5.0.50/runtime-contracts')
          payload = ''.join(
              path.read_text(encoding='utf-8')
              for path in sorted(root.glob('payload.*'))
          )
          Path(os.environ['RUNTIME_PATCH']).write_bytes(
              gzip.decompress(base64.b64decode(payload)))
          '@ | python -
          git apply --whitespace=error-all $patch
          Remove-Item .github/workflows/temporary-runtime-contracts.yml
          Remove-Item tools/0.5.0.50/runtime-contracts -Recurse
          git add --all
          git diff --cached --check
          git diff --cached --name-status "origin/$env:BASE_BRANCH"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\src\SightAdapt\SightAdapt.csproj
          dotnet restore .\tests\SightAdapt.Tests\SightAdapt.Tests.csproj

      - name: Build
        shell: pwsh
        run: dotnet build .\src\SightAdapt\SightAdapt.csproj --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: >-
          dotnet test .\tests\SightAdapt.Tests\SightAdapt.Tests.csproj
          --configuration Release
          --no-restore
          --results-directory "$env:RUNNER_TEMP\runtime-results"
          --logger "trx;LogFileName=runtime-contracts.trx"

      - name: Create validated Git commit object
        shell: pwsh
        run: |
          @'
          import base64
          import json
          import os
          import subprocess
          import traceback
          import urllib.request
          from pathlib import Path

          repository = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base_branch = os.environ['BASE_BRANCH']
          api_root = f'https://api.github.com/repos/{repository}'
          bootstrap_file = '.github/workflows/temporary-runtime-contracts.yml'
          bootstrap_prefix = 'tools/0.5.0.50/runtime-contracts/'
          output_directory = Path(os.environ['RUNNER_TEMP'])

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'SightAdapt-validated-commit-builder',
                  })
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          def is_bootstrap(path):
              return path == bootstrap_file or path.startswith(bootstrap_prefix)

          try:
              base_sha = subprocess.check_output(
                  ['git', 'rev-parse', f'origin/{base_branch}'],
                  text=True).strip()
              base_commit = request('GET', f'/git/commits/{base_sha}')
              output = subprocess.check_output(
                  ['git', 'diff', '--cached', '--name-status',
                   f'origin/{base_branch}', '--'],
                  text=True,
                  encoding='utf-8')
              entries = []
              for line in output.splitlines():
                  fields = line.split('\t')
                  status = fields[0]
                  if status.startswith('R'):
                      old_path, path = fields[1], fields[2]
                      if not is_bootstrap(old_path):
                          entries.append({
                              'path': old_path,
                              'mode': '100644',
                              'type': 'blob',
                              'sha': None,
                          })
                  else:
                      path = fields[1]

                  if is_bootstrap(path):
                      continue

                  if status.startswith('D'):
                      entries.append({
                          'path': path,
                          'mode': '100644',
                          'type': 'blob',
                          'sha': None,
                      })
                      continue

                  blob = request('POST', '/git/blobs', {
                      'content': base64.b64encode(
                          Path(path).read_bytes()).decode('ascii'),
                      'encoding': 'base64',
                  })
                  entries.append({
                      'path': path,
                      'mode': '100644',
                      'type': 'blob',
                      'sha': blob['sha'],
                  })

              if not any(entry['path'].endswith('RuntimeOverlay.cs')
                         for entry in entries):
                  raise RuntimeError('RuntimeOverlay.cs is missing from the validated tree.')

              tree = request('POST', '/git/trees', {
                  'base_tree': base_commit['tree']['sha'],
                  'tree': entries,
              })
              commit = request('POST', '/git/commits', {
                  'message': 'Use explicit runtime contracts and coherent settings snapshots',
                  'tree': tree['sha'],
                  'parents': [base_sha],
              })
              (output_directory / 'validated-commit.txt').write_text(
                  commit['sha'] + '\n', encoding='utf-8')
              print(f"created validated commit {commit['sha']} with {len(entries)} entries")
          except Exception:
              (output_directory / 'validated-error.txt').write_text(
                  traceback.format_exc(), encoding='utf-8')
              raise
          '@ | python -

      - name: Upload validated commit and tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-contracts-v3-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\validated-commit.txt
            ${{ runner.temp }}\validated-error.txt
            ${{ runner.temp }}\runtime-results\runtime-contracts.trx
          if-no-files-found: ignore
          retention-days: 3
