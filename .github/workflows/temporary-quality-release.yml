name: Publish Finish semantic architecture gates and canonical 0.5.0.50 release metadata

on:
  pull_request:
    branches: ["0.5.0.50-alpha"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: publish-quality-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-validate-export:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/0.5.0.50-quality-release'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Reconstruct reviewed patch
        shell: pwsh
        run: |
          $patch = Join-Path $env:RUNNER_TEMP 'quality-release.patch'
          $env:SIGHTADAPT_PATCH = $patch
          @'
          import base64
          import gzip
          import os
          from pathlib import Path

          root = Path('tools/0.5.0.50/quality-release')
          parts = sorted(root.glob('payload.*'))
          if not parts:
              raise RuntimeError('No reviewed patch payload was found.')
          payload = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          Path(os.environ['SIGHTADAPT_PATCH']).write_bytes(
              gzip.decompress(base64.b64decode(payload))
          )
          '@ | python -
          git fetch origin "+refs/heads/0.5.0.50-alpha:refs/remotes/origin/0.5.0.50-alpha"
          git reset --hard origin/0.5.0.50-alpha
          git apply --index --whitespace=error-all $patch
          @'
          from pathlib import Path

          path = Path('tests/SightAdapt.Tests/ArchitectureComplianceTests.cs')
          source = path.read_text(encoding='utf-8')

          negative = (
              ".Where(call => !allowed.Contains(\n"
              "                OwnerType(call.Caller.DeclaringType)))")
          negative_replacement = (
              ".Where(call =>\n"
              "                OwnerType(call.Caller.DeclaringType) is not { } owner ||\n"
              "                !allowed.Contains(owner))")
          if source.count(negative) != 2:
              raise RuntimeError(
                  'Expected exactly two null-unsafe allowed-owner checks.')
          source = source.replace(negative, negative_replacement)

          positive = (
              ".Where(call => allowedCallers.Contains(\n"
              "                OwnerType(call.Caller.DeclaringType)))")
          positive_replacement = (
              ".Where(call =>\n"
              "                OwnerType(call.Caller.DeclaringType) is { } owner &&\n"
              "                allowedCallers.Contains(owner))")
          if source.count(positive) != 1:
              raise RuntimeError(
                  'Expected exactly one null-unsafe caller-owner check.')
          source = source.replace(positive, positive_replacement)
          path.write_text(source, encoding='utf-8', newline='\n')
          '@ | python -
          git add tests/SightAdapt.Tests/ArchitectureComplianceTests.cs
          git diff --cached --check
          if (-not (Test-Path 'Directory.Build.props')) { throw 'Expected validated marker is missing: Directory.Build.props' }
          if (-not (Test-Path 'tests/SightAdapt.Tests/TestSupport.cs')) { throw 'Expected validated marker is missing: tests/SightAdapt.Tests/TestSupport.cs' }
          if (-not (Test-Path 'tests/SightAdapt.Tests/ReleaseMetadataTests.cs')) { throw 'Expected validated marker is missing: tests/SightAdapt.Tests/ReleaseMetadataTests.cs' }
          if (-not (Test-Path 'tools/verify-release-metadata.ps1')) { throw 'Expected validated marker is missing: tools/verify-release-metadata.ps1' }
          if (-not (git diff --cached --name-only)) { throw 'The reviewed patch produced no changes.' }

      - name: Verify release metadata
        shell: pwsh
        run: .\tools\verify-release-metadata.ps1

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore ./src/SightAdapt/SightAdapt.csproj
          dotnet restore ./tests/SightAdapt.Tests/SightAdapt.Tests.csproj

      - name: Build
        shell: pwsh
        run: |
          $output = & dotnet build ./src/SightAdapt/SightAdapt.csproj --configuration Release --no-restore 2>&1
          $code = $LASTEXITCODE
          $output | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'quality-release-build.txt') -Encoding utf8
          $output | ForEach-Object { Write-Host $_ }
          exit $code

      - name: Test
        shell: pwsh
        run: |
          $results = Join-Path $env:RUNNER_TEMP 'quality-release-results'
          $output = & dotnet test ./tests/SightAdapt.Tests/SightAdapt.Tests.csproj --configuration Release --no-restore --results-directory $results --logger "trx;LogFileName=quality-release.trx" 2>&1
          $code = $LASTEXITCODE
          $output | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'quality-release-test.txt') -Encoding utf8
          $output | ForEach-Object { Write-Host $_ }
          exit $code

      - name: Publish self-contained Windows candidate
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'quality-release-publish'
          dotnet publish ./src/SightAdapt/SightAdapt.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            --output $outputDirectory

      - name: Prepare validated publication metadata
        shell: pwsh
        run: |
          git rev-parse "origin/0.5.0.50-alpha^{tree}" | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'base-tree.txt') -Encoding ascii
          git diff --cached --binary origin/0.5.0.50-alpha | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'validated-quality-release.patch') -Encoding utf8
          git diff --cached --name-status origin/0.5.0.50-alpha | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'validated-files.txt') -Encoding utf8

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-release-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/quality-release-build.txt
            ${{ runner.temp }}/quality-release-test.txt
            ${{ runner.temp }}/quality-release-results/quality-release.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload validated source and Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: SightAdapt-0.5.0.50-alpha-validated-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/base-tree.txt
            ${{ runner.temp }}/validated-quality-release.patch
            ${{ runner.temp }}/validated-files.txt
            ${{ runner.temp }}/quality-release-results/quality-release.trx
            ${{ runner.temp }}/quality-release-publish/
            .github/
            docs/
            src/
            tests/
            tools/
            Directory.Build.props
            .gitignore
            CONTRIBUTING.md
            LICENSE
            README.md
            SECURITY.md
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
