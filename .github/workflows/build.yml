name: Build and test SightAdapt

on:
  workflow_dispatch:
  push:
    branches: [main, "0.5.0.50-alpha", "release/**"]
  pull_request:
    branches: [main, "0.5.0.50-alpha"]

concurrency:
  group: sightadapt-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify release metadata
        id: release
        shell: pwsh
        run: .\tools\verify-release-metadata.ps1 -WriteGitHubOutput

      - name: Restore application
        run: dotnet restore src/SightAdapt/SightAdapt.csproj

      - name: Restore tests
        run: dotnet restore tests/SightAdapt.Tests/SightAdapt.Tests.csproj

      - name: Build
        shell: pwsh
        run: |
          $output = & dotnet build src/SightAdapt/SightAdapt.csproj --configuration Release --no-restore 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content -Path build-output.txt -Encoding utf8
          $output | ForEach-Object { Write-Host $_ }
          exit $exitCode

      - name: Test
        shell: pwsh
        run: |
          $output = & dotnet test tests/SightAdapt.Tests/SightAdapt.Tests.csproj --configuration Release --no-restore --results-directory TestResults --logger "trx;LogFileName=SightAdapt.trx" 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content -Path test-output.txt -Encoding utf8
          $output | ForEach-Object { Write-Host $_ }
          exit $exitCode

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SightAdapt-build-diagnostics-${{ github.run_id }}
          path: |
            build-output.txt
            test-output.txt
            TestResults/SightAdapt.trx
          if-no-files-found: warn
          retention-days: 7

      - name: Publish self-contained alpha
        run: >-
          dotnet publish src/SightAdapt/SightAdapt.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output artifacts/win-x64

      - name: Create and verify Windows alpha archive
        shell: pwsh
        run: |
          $archivePath = "artifacts/${{ steps.release.outputs.artifact_name }}.zip"
          Remove-Item $archivePath -Force -ErrorAction SilentlyContinue
          Compress-Archive `
              -Path "artifacts/win-x64/*" `
              -DestinationPath $archivePath `
              -CompressionLevel Optimal
          .\tools\test-release-package.ps1 -ArchivePath $archivePath

      - name: Upload Windows alpha
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}-${{ github.run_id }}
          path: artifacts/${{ steps.release.outputs.artifact_name }}.zip
          if-no-files-found: error
          retention-days: 7
