name: Temporary publish domain and settings refactor

on:
  pull_request:
    branches: ["0.5.0.50-alpha"]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/0.5.0.50-domain-settings'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Reconstruct and apply reviewed patch
        shell: pwsh
        run: |
          $patch = Join-Path $env:RUNNER_TEMP 'domain-settings.patch'
          $env:DOMAIN_SETTINGS_PATCH = $patch
          @'
          import base64
          import gzip
          import os
          from pathlib import Path

          root = Path('tools/0.5.0.50/domain-settings')
          parts = [root / 'payload.00']
          for group in ('01', '02', '03'):
              parts.extend(sorted(root.glob(f'payload.{group}.*')))
          payload = ''.join(path.read_text(encoding='utf-8') for path in parts)
          data = gzip.decompress(base64.b64decode(payload))
          Path(os.environ['DOMAIN_SETTINGS_PATCH']).write_bytes(data)
          print(f'payload parts={len(parts)}; patch bytes={len(data)}')
          '@ | python -
          git apply --verbose --whitespace=error-all $patch
          @'
          from pathlib import Path

          replacements = {
              'tests/SightAdapt.Tests/VisualProfileTests.cs': [
                  ('VisualProfile\n                            .DefaultSoftInvertId',
                   'VisualProfileCatalog\n                            .DefaultSoftInvertId'),
              ],
              'tests/SightAdapt.Tests/OverlayScopeTests.cs': [
                  ('OverlayScopePolicy.IsSupportedTransform', 'OverlayScopePolicy.IsSupported'),
                  ('OverlayScopePolicy.GetTransformDisplayName', 'OverlayScopePolicy.GetDisplayName'),
              ],
              'tests/SightAdapt.Tests/RuntimeMenuProfileTests.cs': [
                  ('OverlayScopePolicy.IsSupportedTransform', 'OverlayScopePolicy.IsSupported'),
              ],
              'tests/SightAdapt.Tests/RuntimeCoordinatorTests.cs': [
                  ('OverlayScopePolicy.IsSupportedTransform', 'OverlayScopePolicy.IsSupported'),
              ],
          }
          for name, rules in replacements.items():
              path = Path(name)
              source = path.read_text(encoding='utf-8')
              for old, new in rules:
                  if old not in source:
                      raise RuntimeError(f'Expected test reference not found in {name}: {old}')
                  source = source.replace(old, new)
              path.write_text(source, encoding='utf-8', newline='\n')
          '@ | python -
          if (-not (Test-Path .\src\SightAdapt\VisualProfileCatalog.cs)) {
            throw 'The patch did not create VisualProfileCatalog.cs.'
          }
          if (Test-Path .\src\SightAdapt\ApplicationProfile.cs) {
            throw 'The patch did not remove ApplicationProfile.cs.'
          }
          git diff --check

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\src\SightAdapt\SightAdapt.csproj
          dotnet restore .\tests\SightAdapt.Tests\SightAdapt.Tests.csproj

      - name: Build
        shell: pwsh
        run: |
          $output = & dotnet build .\src\SightAdapt\SightAdapt.csproj --configuration Release --no-restore 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content -Path "$env:RUNNER_TEMP\domain-settings-build.txt" -Encoding utf8
          $output | ForEach-Object { Write-Host $_ }
          exit $exitCode

      - name: Test
        shell: pwsh
        run: |
          $results = Join-Path $env:RUNNER_TEMP 'domain-settings-results'
          $output = & dotnet test .\tests\SightAdapt.Tests\SightAdapt.Tests.csproj --configuration Release --no-restore --results-directory $results --logger "trx;LogFileName=domain-settings.trx" 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content -Path "$env:RUNNER_TEMP\domain-settings-test.txt" -Encoding utf8
          $output | ForEach-Object { Write-Host $_ }
          exit $exitCode

      - name: Publish validated source tree
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-publish-domain-settings.yml
          git rm -r tools/0.5.0.50/domain-settings
          git add --all
          git diff --cached --check
          if (-not (git diff --cached --name-only | Select-String 'VisualProfileCatalog.cs')) {
            throw 'Validated source changes are not staged.'
          }
          git commit -m 'Centralize profile definitions and isolate settings persistence'
          git push origin "HEAD:refs/heads/$env:GITHUB_HEAD_REF"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-settings-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\domain-settings-build.txt
            ${{ runner.temp }}\domain-settings-test.txt
            ${{ runner.temp }}\domain-settings-results\domain-settings.trx
          if-no-files-found: ignore
          retention-days: 3
