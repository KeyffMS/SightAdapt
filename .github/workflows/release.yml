name: Publish SightAdapt GitHub Release

on:
  workflow_run:
    workflows: ["Build and test SightAdapt"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: sightadapt-github-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Resolve source build
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_run") {
              $sourceSha = "${{ github.event.workflow_run.head_sha }}"
              $sourceRunId = "${{ github.event.workflow_run.id }}"
          }
          else {
              $sourceSha = "${{ github.sha }}"
              $runs = gh run list --workflow build.yml --branch main --event push --status success --limit 30 --json databaseId,headSha | ConvertFrom-Json
              $match = @($runs | Where-Object { [string]$_.headSha -eq $sourceSha }) | Select-Object -First 1
              if ($null -eq $match) {
                  throw "No successful main build exists for source commit $sourceSha."
              }
              $sourceRunId = [string]$match.databaseId
          }

          if ($sourceSha -notmatch '^[0-9a-fA-F]{40}$') {
              throw "Source SHA is invalid: $sourceSha"
          }
          if ($sourceRunId -notmatch '^\d+$') {
              throw "Source workflow run id is invalid: $sourceRunId"
          }

          "source_sha=$sourceSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "source_run_id=$sourceRunId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 2

      - name: Read publication request
        id: request
        shell: pwsh
        run: |
          $requestPath = "release/release-request.json"
          if (-not (Test-Path -LiteralPath $requestPath)) {
              throw "Release request file is missing."
          }

          $request = Get-Content -LiteralPath $requestPath -Raw | ConvertFrom-Json
          if ([int]$request.schemaVersion -ne 1) {
              throw "Unsupported release request schema."
          }

          $requestChanged = $true
          if ("${{ github.event_name }}" -eq "workflow_run") {
              $changed = @(git diff-tree --no-commit-id --name-only -r HEAD)
              $requestChanged = $changed -contains $requestPath
          }

          $shouldPublish = [bool]$request.publish -and $requestChanged
          "should_publish=$($shouldPublish.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if (-not $shouldPublish) {
              Write-Host "No approved release publication request exists for this commit."
              exit 0
          }

          if (-not [bool]$request.manualWindowsSmokeAccepted) {
              throw "Release request is blocked: manual Windows smoke testing has not been accepted."
          }
          if (-not [bool]$request.immutableReleasesConfirmed) {
              throw "Release request is blocked: repository release immutability has not been confirmed."
          }
          if ([int]$request.maintainerDecisionIssue -ne 98) {
              throw "Release request must remain tied to issue #98."
          }

          "requested_version=$([string]$request.productVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$([string]$request.tag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$([bool]$request.prerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "notes_file=$([string]$request.notesFile)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify canonical release metadata
        if: steps.request.outputs.should_publish == 'true'
        id: release
        shell: pwsh
        run: .\tools\verify-release-metadata.ps1 -WriteGitHubOutput

      - name: Validate request against canonical version
        if: steps.request.outputs.should_publish == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.product_version }}"
          $requestedVersion = "${{ steps.request.outputs.requested_version }}"
          $tag = "${{ steps.request.outputs.tag }}"
          $notesFile = "${{ steps.request.outputs.notes_file }}"

          if ($requestedVersion -ne $version) {
              throw "Requested version '$requestedVersion' does not match canonical version '$version'."
          }
          if ($tag -ne "v$version") {
              throw "Release tag '$tag' must be exactly 'v$version'."
          }
          if (-not (Test-Path -LiteralPath $notesFile)) {
              throw "Release notes file does not exist: $notesFile"
          }

      - name: Download verified CI package
        if: steps.request.outputs.should_publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = "${{ steps.source.outputs.source_run_id }}"
          $artifactName = "${{ steps.release.outputs.artifact_name }}-$runId"
          New-Item -ItemType Directory -Path artifacts/source -Force | Out-Null
          gh run download $runId --name $artifactName --dir artifacts/source
          if ($LASTEXITCODE -ne 0) {
              throw "Could not download verified build artifact '$artifactName'."
          }

      - name: Re-verify package for GitHub Release channel
        if: steps.request.outputs.should_publish == 'true'
        shell: pwsh
        run: |
          $artifactName = "${{ steps.release.outputs.artifact_name }}"
          $sourceZip = "artifacts/source/$artifactName.zip"
          if (-not (Test-Path -LiteralPath $sourceZip)) {
              throw "Verified CI ZIP is missing: $sourceZip"
          }

          Remove-Item artifacts/release-stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path artifacts/release-stage -Force | Out-Null
          Expand-Archive -LiteralPath $sourceZip -DestinationPath artifacts/release-stage

          New-Item -ItemType Directory -Path artifacts/release-assets -Force | Out-Null
          $releaseZip = "artifacts/release-assets/$artifactName.zip"
          $report = "artifacts/release-assets/$artifactName-compliance.json"
          $tag = "${{ steps.request.outputs.tag }}"

          .\tools\new-verified-release-package.ps1 `
              -DirectoryPath artifacts/release-stage `
              -ArchivePath $releaseZip `
              -ReportPath $report `
              -DistributionChannel github-release `
              -SourceCommitSha "${{ steps.source.outputs.source_sha }}" `
              -SourceRef "refs/tags/$tag" `
              -ReleaseTag $tag `
              -WorkflowName "${{ github.workflow }}" `
              -WorkflowRunId "${{ github.run_id }}" `
              -WorkflowRunAttempt "${{ github.run_attempt }}"

          $individualAssets = @(
              "LICENSE.txt",
              "THIRD-PARTY-NOTICES.txt",
              "DOTNET-LICENSE-NOTICE.txt",
              "DOTNET-NOTICE-METADATA.json",
              "MICROSOFT-DOTNET-REDISTRIBUTION.txt",
              "THIRD-PARTY-NAMES-AND-DRM-NOTICE.txt",
              "DEPENDENCIES.md",
              "SBOM.spdx.json",
              "LICENSE-REPORT.json",
              "PRIVACY.md"
          )
          foreach ($asset in $individualAssets) {
              Copy-Item -LiteralPath (Join-Path "artifacts/release-stage" $asset) -Destination "artifacts/release-assets/$asset"
          }

          $hashLines = Get-ChildItem artifacts/release-assets -File |
              Sort-Object Name |
              ForEach-Object {
                  $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$hash  $($_.Name)"
              }
          $hashLines | Set-Content -LiteralPath artifacts/release-assets/SHA256SUMS.txt -Encoding utf8

      - name: Create or validate immutable version tag
        if: steps.request.outputs.should_publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.request.outputs.tag }}"
          $sourceSha = "${{ steps.source.outputs.source_sha }}"

          gh release view $tag --json tagName,url 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
              throw "Release '$tag' already exists. Published releases are never overwritten."
          }

          $remote = git ls-remote --tags origin "refs/tags/$tag"
          if (-not [string]::IsNullOrWhiteSpace($remote)) {
              $existingSha = ($remote -split "\s+")[0]
              if ($existingSha -ne $sourceSha) {
                  throw "Existing tag '$tag' points to $existingSha instead of $sourceSha."
              }
              Write-Host "Reusing orphaned tag '$tag' at the expected source commit."
          }
          else {
              git tag $tag $sourceSha
              if ($LASTEXITCODE -ne 0) { throw "Could not create tag '$tag'." }
              git push origin "refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) { throw "Could not push tag '$tag'." }
          }

      - name: Publish GitHub Release
        if: steps.request.outputs.should_publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.request.outputs.tag }}"
          $version = "${{ steps.release.outputs.product_version }}"
          $notesFile = "${{ steps.request.outputs.notes_file }}"
          $assets = @(Get-ChildItem artifacts/release-assets -File | Sort-Object Name | ForEach-Object { $_.FullName })

          $arguments = @(
              "release", "create", $tag
          ) + $assets + @(
              "--verify-tag",
              "--title", "SightAdapt™ $version",
              "--notes-file", $notesFile,
              "--latest=false"
          )
          if ("${{ steps.request.outputs.prerelease }}" -eq "true") {
              $arguments += "--prerelease"
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release publication failed."
          }

      - name: Verify published release
        if: steps.request.outputs.should_publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.request.outputs.tag }}"
          $release = gh release view $tag --json tagName,name,isDraft,isPrerelease,isImmutable,url | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
              throw "Published release could not be read back."
          }
          if ([string]$release.tagName -ne $tag -or [bool]$release.isDraft) {
              throw "Published release metadata is inconsistent."
          }
          if (-not [bool]$release.isImmutable) {
              throw "Release was published but GitHub does not report it as immutable. Stop publication work and investigate repository settings."
          }
          $release | ConvertTo-Json -Depth 5 | Set-Content artifacts/release-metadata.json -Encoding utf8
          Write-Host "Published immutable GitHub Release: $($release.url)"

      - name: Retain release evidence
        if: always() && steps.request.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SightAdapt-github-release-evidence-${{ github.run_id }}
          path: |
            artifacts/release-assets/**
            artifacts/release-metadata.json
          if-no-files-found: warn
          retention-days: 30
