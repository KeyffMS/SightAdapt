name: Temporary None visual profile 0.5.0.36

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/issue-47-native-menu-profiles'
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply None profile update
        shell: pwsh
        run: |
          python .\tools\none-profile-0.5.0.36.py
          git diff --check
          if (-not (git status --porcelain)) {
            throw 'The None profile patch produced no changes.'
          }

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\src\SightAdapt\SightAdapt.csproj
          dotnet restore .\tests\SightAdapt.Tests\SightAdapt.Tests.csproj

      - name: Build
        shell: pwsh
        run: |
          $output = & dotnet build .\src\SightAdapt\SightAdapt.csproj --configuration Release --no-restore 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content -Path "$env:RUNNER_TEMP\none-profile-build.txt" -Encoding utf8
          $output | ForEach-Object { Write-Host $_ }
          exit $exitCode

      - name: Test
        shell: pwsh
        run: |
          $results = "$env:RUNNER_TEMP\none-profile-test-results"
          $output = & dotnet test .\tests\SightAdapt.Tests\SightAdapt.Tests.csproj `
            --configuration Release `
            --no-restore `
            --results-directory $results `
            --logger "trx;LogFileName=none-profile-0.5.0.36.trx" 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content -Path "$env:RUNNER_TEMP\none-profile-test.txt" -Encoding utf8
          $output | ForEach-Object { Write-Host $_ }
          exit $exitCode

      - name: Publish validated branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/temporary-none-profile-0.5.0.36.yml
          git rm --ignore-unmatch tools/none-profile-0.5.0.36.py
          git add --all
          git diff --cached --check
          if (-not (git diff --cached --name-only)) {
            throw 'No validated changes are available to publish.'
          }
          git commit -m 'Add None profile for menu-only correction (0.5.0.36)'
          $lease = "refs/heads/$env:GITHUB_HEAD_REF`:$env:EXPECTED_HEAD"
          git push --force-with-lease=$lease origin "HEAD:refs/heads/$env:GITHUB_HEAD_REF"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: none-profile-0.5.0.36-diagnostics
          path: |
            ${{ runner.temp }}\none-profile-build.txt
            ${{ runner.temp }}\none-profile-test.txt
            ${{ runner.temp }}\none-profile-test-results\**\*.trx
          if-no-files-found: ignore
          retention-days: 3
