name: Validate and deploy SightAdapt website

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "tools/build-site.py"
      - "tools/verify-site.py"
      - "assets/brand/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/build-site.py"
      - "tools/verify-site.py"
      - "assets/brand/**"
      - ".github/workflows/pages.yml"

concurrency:
  group: sightadapt-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build GitHub Pages fallback
        run: python tools/build-site.py --base-path /SightAdapt/ --output artifacts/site

      - name: Validate GitHub Pages fallback
        run: python tools/verify-site.py artifacts/site --base-path /SightAdapt/

      - name: Build canonical Aiteracja path
        run: python tools/build-site.py --base-path /sightadapt/ --output artifacts/site-canonical

      - name: Validate canonical Aiteracja path
        run: python tools/verify-site.py artifacts/site-canonical --base-path /sightadapt/

      - name: Upload validated GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages fallback
        id: deployment
        uses: actions/deploy-pages@v4
